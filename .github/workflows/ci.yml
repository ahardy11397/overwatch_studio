name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat

      - name: Install vcpkg dependencies
        run: |
          C:\vcpkg\vcpkg install --triplet x64-windows soxr simdjson libzip openssl

      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure -C ${{ matrix.config }}

      - name: Run shader compile test
        run: |
          # Verify D3D11 shaders compile on a NULL device
          # This catches HLSL syntax errors early
          build\bin\${{ matrix.config }}\AudioEngineTests.exe --gtest_filter="VideoEngineTest.*" 2>&1 || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: matrix.config == 'Release'
        with:
          name: overwatch-studio-${{ matrix.config }}
          path: build/bin/${{ matrix.config }}/*.exe
          retention-days: 7
